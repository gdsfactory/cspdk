name: Code Security

on:
  pull_request:
  merge_group:
    branches: [main]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  security:
    permissions:
      contents: read
    # TEMP: local copy of doplaydo/pdk-ci-workflow#374 until it reaches pdk-ci-workflow-public
    uses: ./.github/workflows/code-security-reusable.yml
