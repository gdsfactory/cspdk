name: Sample projects · editable PDK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-sample-projects:
    uses: doplaydo/pdk-ci-workflow/.github/workflows/sample-projects.yml@donotmerge/test-402
    with:
      pdk_source: editable
    secrets:
      GFP_API_KEY: ${{ secrets.GFP_API_KEY }}
      PDK_CI_WORKFLOW_TOKEN: ${{ secrets.PDK_CI_WORKFLOW_TOKEN }}
