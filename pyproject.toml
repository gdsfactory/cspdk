# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{ name = "gdsfactory", email = "contact@gdsfactory.com" }]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent"
]
dependencies = [
  "gdsfactory~=9.51.0",
  "gdsfactoryplus",
  "gplugins[sax,femwell,tidy3d]~=2.1.0",
  "circulax>=0.2.3",
  "klujax>=0.5.1"
]
description = "CornerStone PDK"
keywords = ["cornerstone", "cspdk", "eda", "gdsfactory", "pdk", "photonics", "python"]
license = { file = "LICENSE" }
name = "cspdk"
readme = "README.md"
requires-python = ">=3.12,<3.15"
version = "2.0.0"

[project.optional-dependencies]
dev = [
  "doroutes",
  "jsondiff",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-github-actions-annotate-failures",
  "pytest_regressions",
  "tbump",
  "towncrier"
]
docs = [
  "jupyter",
  "kwasm",
  "mkdocs-material",
  "mkdocs-with-pdf",
  "nbconvert",
  "mkdocstrings[python]>=0.27.0",
  "zensical>=0.0.40,<0.1.0"
]

[tool.codespell]
ignore-words-list = "te, te/tm, te, ba, fpr, fpr_spacing, ro, nd, donot, schem, euclidian"
skip = "references/*"

[tool.gdsfactoryplus]
name = "cspdk.si220"

[tool.gdsfactoryplus.drc]
pdk = "cspdk"
timeout = 300

[tool.gdsfactoryplus.pdk]
# Layout-only cells: no ports to model (the fixed foundry heater has none).
# The Run 50 dies are layout only, and the graphene, photodiode, laser and
# focusing-grating fixed cells have no foundry optical data to build a model from.
cells_no_model_expected = [
  "add_pads_top",
  "compass",
  "die",
  "die_half",
  "die_with_pads",
  "heater",
  "text_rectangular",
  "text_rectangular_multi_layer",
  "grating_coupler_focusing_apodized",
  "graphene_bolometer",
  "graphene_bolometer_with_gc",
  "graphene_bolometer_metallic",
  "graphene_bolometer_metallic_with_gc",
  "graphene_bolometer_no_gate",
  "graphene_bolometer_no_gate_with_gc",
  "graphene_eam",
  "graphene_eam_with_gc",
  "graphene_pte",
  "graphene_pte_with_gc",
  "graphene_pte_metallic",
  "graphene_pte_metallic_with_gc",
  "photodiode",
  "photodiode_integrated",
  "laser_full",
  "laser_full_or_gc",
  "laser_full_with_gc",
  "laser_half",
  "laser_half_or_gc",
  "laser_half_with_gc"
]
name = "cspdk.si220"
options = [
  "cspdk.si220",
  "cspdk.si500",
  "cspdk.sin300",
  "cspdk.si340",
  "cspdk.si_sus",
  "cspdk.sin200",
  "cspdk.ge_on_si"
]

[tool.gdsfactoryplus.project]
identifier = "cspdk"

[tool.gdsfactoryplus.sim.wls]
max = 1.6
min = 1.5
num = 1000

[tool.hatch.build.targets.sdist]
# Package only (no tests, references or samples), as the flit-built sdists were.
exclude = ["cspdk/*/samples"]
include = ["/cspdk", "/CHANGELOG.md", "/LICENSE", "/README.md"]

[tool.hatch.build.targets.wheel]
exclude = ["cspdk/*/samples"]
packages = ["cspdk"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pylsp-mypy]
enabled = true
live_mode = true
strict = true

[tool.pytest.ini_options]
# addopts = --tb=no
addopts = '--tb=short'
norecursedirs = ["extra/*.py"]
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
fix = true

[tool.ruff.lint]
ignore = [
  "E501",  # line too long, handled by black
  "B008",  # do not perform function calls in argument defaults
  "C901",  # too complex
  "B905",  # `zip()` without an explicit `strict=` parameter
  "C408"  # C408 Unnecessary `dict` call (rewrite as a literal)
]
select = [
  "B",  # flake8-bugbear
  "C",  # flake8-comprehensions
  "D",  # pydocstyle
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "T10",  # flake8-debugger
  "UP",  # pyupgrade
  "W"  # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"cspdk/si220/cells/__init__.py" = [
  "F403"
]  # allowing star imports to aggregate cells
"cspdk/si220/models/__init__.py" = [
  "F403"
]  # allowing star imports to aggregate cells
"references/**" = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools.package-data]
"*" = [
  "*.csv",
  "*.yaml",
  "*.yml",
  "*.gds",
  "*.lyp",
  "*.oas",
  "*.lyt",
  "*.dat",
  "*.nc",
  "*.svg",
  "*.GDS",
  "*.OAS"
]

[tool.setuptools.packages]
find = {}

[tool.tbump]

[[tool.tbump.before_commit]]
cmd = "towncrier build --yes --version {new_version}"
name = "create & check changelog"

[[tool.tbump.file]]
src = "README.md"

[[tool.tbump.file]]
src = "pyproject.toml"

[[tool.tbump.file]]
src = "cspdk/__init__.py"

[tool.tbump.git]
message_template = "Bump to {new_version}"
tag_template = "v{new_version}"

[tool.tbump.version]
current = "2.0.0"
# Example of a semver regexp.
# Make sure this matches current_version before
# using tbump
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  '''

[tool.towncrier]
directory = ".changelog.d"
filename = "CHANGELOG.md"
issue_format = "[#{issue}](https://github.com/gdsfactory/cspdk/issues/{issue})"
package = "gdsfactory"
start_string = "<!-- towncrier release notes start -->\n"
template = ".changelog.d/changelog_template.jinja"
title_format = "## [{version}](https://github.com/gdsfactory/cspdk/releases/tag/v{version}) - {project_date}"
underlines = ["", "", ""]
