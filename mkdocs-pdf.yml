site_name: CornerStone PDK
docs_dir: docs
site_dir: build/pdf
nav:
  - Home: index.md
  - Reference:
      - Cells Si220: cells_si220.md
      - Cells Si340: cells_si340.md
      - Cells Si500: cells_si500.md
      - Cells SiN200: cells_sin200.md
      - Cells SiN300: cells_sin300.md
      - Cells Suspended Si: cells_si_sus.md
      - Cells Ge-on-Si: cells_ge_on_si.md
      - Models Si220: models_si220.md
      - Models Si340: models_si340.md
      - Models Si500: models_si500.md
      - Models SiN200: models_sin200.md
      - Models SiN300: models_sin300.md
      - Models Suspended Si: models_si_sus.md
      - Models Ge-on-Si: models_ge_on_si.md
      - Changelog: changelog.md
  - Notebooks:
      - "FDTD: directional coupler (Meep)": notebooks/meep_dc.md
      - "FDTD: MMI (Meep)": notebooks/meep_mmi.md
markdown_extensions:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - admonition
plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_toc_entry: false
            show_source: false
  - with-pdf:
      author: GDSFactory
      cover_subtitle: Photonics Process Design Kit
      output_path: ../../docs.pdf
theme:
  name: material
  logo: logo.png
